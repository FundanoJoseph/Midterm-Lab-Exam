name: CI - Student Information System

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-info-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: pytest -v

      - name: Smoke-test the CLI menu
        run: |
          printf '2\n5\njuan\n6\n7\n0\n' | python -m src.main
